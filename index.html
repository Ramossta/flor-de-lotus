<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flor-de-lótus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap">
<style>
:root{
  --sky-top:#fde7ea; --sky-bot:#f7efe6; --water:#a9cfcf; --pad:#5a9470;
  --ink:#43243a; --glow:#ffc4da; --ring:#2d6a6a; --btn-bg:rgba(255,255,255,.55); --track:rgba(67,36,58,.3);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky-top:#0a1024; --sky-bot:#1d2c52; --water:#0c2236; --pad:#1f5a45;
    --ink:#f6e6ee; --glow:#ff9cc4; --ring:#7fc4d6; --btn-bg:rgba(255,255,255,.08); --track:rgba(255,255,255,.3);
  }
}
:root[data-theme="dark"]{
  --sky-top:#0a1024; --sky-bot:#1d2c52; --water:#0c2236; --pad:#1f5a45;
  --ink:#f6e6ee; --glow:#ff9cc4; --ring:#7fc4d6; --btn-bg:rgba(255,255,255,.08); --track:rgba(255,255,255,.3);
}
*{-webkit-tap-highlight-color:transparent}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
@supports (height:100dvh){html{height:100dvh}}
body{
  margin:0; min-height:100%; overflow-x:hidden; display:flex; flex-direction:column; align-items:center;
  background:linear-gradient(var(--sky-top),var(--sky-bot) 70%); color:var(--ink);
  font-family:"Fraunces",Georgia,serif;
}
main{flex:1; width:100%; display:flex; flex-direction:column; align-items:center}
header{position:relative; z-index:1; padding:26px 20px 0; text-align:center}
h1{margin:0; font-style:italic; font-weight:300; font-size:clamp(2.2rem,10vw,3.4rem); line-height:1.2}
.msg{margin:12px auto 0; max-width:32ch; text-align:center; text-wrap:balance; font-style:italic; font-weight:300; font-size:clamp(1.1rem,4.6vw,1.4rem); line-height:1.5}
.love{display:block; margin-top:.7em; font-size:1.25em}
.stage{width:min(100%,560px); width:min(100%,640px,max(300px,calc((100dvh - 350px)*1.21))); margin-top:auto}
svg{display:block; width:100%; height:auto; overflow:visible; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none}
footer{width:100%; background:var(--water); display:flex; flex-direction:column; align-items:center; gap:16px; padding:6px 20px 26px}

.controls{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center}
button{
  font:inherit; color:var(--ink); background:var(--btn-bg); border:1px solid currentColor;
  border-radius:999px; padding:0 24px; min-height:48px; min-width:10rem; cursor:pointer; touch-action:manipulation;
}
button:hover{background:var(--glow); color:#43243a}
input[type=range]{-webkit-appearance:none; appearance:none; width:min(58vw,240px); height:44px; background:transparent; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:var(--track)}
input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; margin-top:-12px; border-radius:50%; background:#e0457f; border:3px solid #fff}
input[type=range]::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:#e0457f; border:3px solid #fff}
button:focus-visible,input:focus-visible,svg:focus-visible{outline:3px solid var(--ring); outline-offset:3px}
.ripple{fill:none; stroke:var(--ring); stroke-width:1.4; vector-effect:non-scaling-stroke; opacity:0;
  transform-box:fill-box; transform-origin:center; animation:ripple 7s ease-out infinite}
.ripple:nth-child(2){animation-delay:2.3s} .ripple:nth-child(3){animation-delay:4.6s}
@keyframes ripple{0%{transform:scale(.25); opacity:.5} 100%{transform:scale(1.7); opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple{animation:none}}
</style>
</head>
<body>
<main>
  <!-- Troque o título e o texto abaixo pelos seus -->
  <header>
    <h1>Feliz aniversário</h1>
    <p class="msg">Que seu amor floresça como esta flor, e que eu esteja ao seu lado em cada pétala que se abrir.<span class="love">Eu te amo</span></p>
  </header>
  <div class="stage">
<svg id="scene" viewBox="70 140 460 380" role="img" tabindex="0" aria-label="Uma flor-de-lótus rosa abrindo sobre a água">
  <defs id="defs">
    <radialGradient id="halo"><stop offset="0" style="stop-color:var(--glow)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--glow)" stop-opacity="0"/></radialGradient>
    <radialGradient id="pod"><stop offset="0" stop-color="#eadb7a"/><stop offset="1" stop-color="#b8962b"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--water)" stop-opacity="0"/><stop offset="1" style="stop-color:var(--water)" stop-opacity="1"/></linearGradient>
  </defs>
  <rect x="-3000" y="432" width="6600" height="90" style="fill:var(--water)"/>
  <use href="#flower" transform="matrix(1 0 0 -.4 0 610.4)" opacity=".3"/>
  <rect x="-3000" y="436" width="6600" height="86" fill="url(#fade)"/>
  <g>
    <ellipse class="ripple" cx="300" cy="446" rx="150" ry="14"/>
    <ellipse class="ripple" cx="300" cy="446" rx="150" ry="14"/>
    <ellipse class="ripple" cx="300" cy="446" rx="150" ry="14"/>
  </g>
  <ellipse cx="108" cy="470" rx="72" ry="12" style="fill:var(--pad)"/>
  <ellipse cx="508" cy="463" rx="58" ry="10" style="fill:var(--pad)"/>
  <ellipse cx="300" cy="438" rx="118" ry="12" style="fill:var(--pad)"/>
  <circle id="glow" cx="300" cy="350" r="90" fill="url(#halo)" opacity="0"/>
  <g id="flower" transform="translate(300 436)"></g>
  <g id="parts"></g>
</svg>
  </div>
</main>

<footer>
  
  
  
  
  <div class="controls">
    <button id="toggle" type="button">Abrir a flor</button>
    <input id="slider" type="range" min="0" max="1000" value="0" aria-label="Quanto a flor está aberta">
  </div>
</footer>

<script>
(function(){
  var DUR=12000; /* duração da abertura em ms: maior = mais devagar */
  var NS="http://www.w3.org/2000/svg";
  var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(calm)DUR=1200;
  function $(id){return document.getElementById(id)}
  var defs=$("defs"), flower=$("flower"), glow=$("glow"), parts=$("parts"),
      btn=$("toggle"), slider=$("slider"), scene=$("scene");
  function el(tag,a,p){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
  function clamp(x){return x<0?0:x>1?1:x}
  function ease(x){return x*x*x*(x*(x*6-15)+10)}

  var BODY="M0 0C-30 -18 -52 -70 -40 -112C-34 -142 -14 -164 0 -178C14 -164 34 -142 40 -112C52 -70 30 -18 0 0Z";
  var HI="M0 -16C-17 -42 -26 -92 -13 -132C-8 -148 -3 -160 0 -168C3 -160 8 -148 13 -132C26 -92 17 -42 0 -16Z";
  var VEIN="M0 -6C1 -60 -1 -120 0 -166M0 -10C-12 -40 -22 -82 -18 -124M0 -10C12 -40 22 -82 18 -124M0 -12C-24 -38 -38 -72 -32 -110M0 -12C24 -38 38 -72 32 -110";
  var TONES=[
    ["#d93a7b","#ee79a8","#fbc9dc","#fff1cf"],
    ["#e24c8a","#f18db5","#fcd5e4","#fff3d6"],
    ["#ea6a9c","#f6a3c4","#fde0ec","#fff5dc"],
    ["#f287b0","#f9bad2","#fee9f2","#fff7e2"],
    ["#f9a3c3","#fcd0e0","#fff1f6","#fff9e8"]
  ];
  var LAYERS=[
    {n:8,max:94,len:1.00,w:1.00,d:0.00},
    {n:8,max:76,len:0.94,w:0.96,d:0.10},
    {n:7,max:56,len:0.86,w:0.92,d:0.20},
    {n:6,max:38,len:0.76,w:0.90,d:0.30},
    {n:5,max:20,len:0.64,w:0.86,d:0.40}
  ];
  var i,k,petals=[];
  TONES.forEach(function(c,n){
    var g=el("linearGradient",{id:"g"+n,x1:0,y1:0,x2:0,y2:1},defs);
    [0,.4,.8,1].forEach(function(o,j){el("stop",{offset:o,"stop-color":c[j]},g)});
  });
  for(i=0;i<LAYERS.length;i++){
    var L=LAYERS[i], lg=el("g",{},flower);
    for(k=0;k<L.n;k++){
      var pg=el("g",{},lg);
      el("path",{d:BODY,fill:"url(#g"+i+")",stroke:"rgba(176,24,96,.38)","stroke-width":".8","stroke-linejoin":"round"},pg);
      el("path",{d:HI,fill:"#fff",opacity:".16"},pg);
      el("path",{d:VEIN,fill:"none",stroke:"rgba(160,20,80,.26)","stroke-width":".7","stroke-linecap":"round"},pg);
      petals.push({g:pg,L:L,b:-L.max+2*L.max*k/(L.n-1),x:Math.abs(k-(L.n-1)/2)*.008,ph:i*1.7+k*.9});
    }
  }

  /* miolo dourado */
  var heart=el("g",{transform:"translate(0 -10)",opacity:0},flower), st=[];
  for(i=0;i<22;i++){
    var len=40+((i*7)%5)*5, sg=el("g",{},heart);
    el("line",{x1:0,y1:0,x2:0,y2:-len,stroke:"#f3cd6a","stroke-width":1.6,"stroke-linecap":"round"},sg);
    el("ellipse",{cx:0,cy:-len,rx:2.2,ry:3.4,fill:"#f2a93b"},sg);
    st.push({g:sg,a:-58+116*i/21});
  }
  el("ellipse",{cx:0,cy:0,rx:16,ry:10,fill:"url(#pod)"},heart);
  [[-8,-2],[0,-4],[8,-2],[-4,2],[4,2],[0,0]].forEach(function(d){el("circle",{cx:d[0],cy:d[1],r:1.3,fill:"#7a5d10",opacity:".55"},heart)});

  /* vaga-lumes / pólen */
  var pts=[];
  for(i=0;i<18;i++){
    pts.push({c:el("circle",{r:(1.2+(i%3)*.7).toFixed(1),fill:i%2?"#ffe9a8":"#ffc4da",opacity:0},parts),
      x:((i*53)%97)/97*180-90, s:.00006+((i*29)%11)*.000007, o:((i*37)%100)/100, w:.8+(i%4)*.35});
  }

  var t=0,target=0,running=false,last=0;

  function update(now){
    var sw=calm?0:1, j;
    for(j=0;j<petals.length;j++){
      var p=petals[j], e=ease(clamp((t-p.L.d-p.x)/.55));
      var a=p.b*(.08+.92*e)+Math.sin(now/1600+p.ph)*1.3*e*sw;
      var sk=-Math.sign(p.b)*Math.abs(p.b)*.11*e;
      var sx=p.L.w*(.5+.5*e), sy=p.L.len*(.86+.14*e);
      p.g.setAttribute("transform","rotate("+a.toFixed(2)+") skewX("+sk.toFixed(2)+") scale("+sx.toFixed(3)+" "+sy.toFixed(3)+")");
    }
    var se=ease(clamp((t-.6)/.4));
    heart.setAttribute("opacity",se.toFixed(3));
    heart.setAttribute("transform","translate(0 -10) scale("+(.5+.5*se).toFixed(3)+")");
    for(j=0;j<st.length;j++){
      st[j].g.setAttribute("transform","rotate("+(st[j].a+Math.sin(now/1100+j)*1.5*sw).toFixed(1)+") scale("+se.toFixed(3)+")");
    }
    var ge=ease(t), pulse=1+.05*Math.sin(now/1300)*ge*sw;
    glow.setAttribute("r",((90+140*ge)*pulse).toFixed(0));
    glow.setAttribute("opacity",(.1+.5*ge).toFixed(2));
    var po=calm?0:ease(clamp((t-.85)/.15));
    for(j=0;j<pts.length;j++){
      var q=pts[j], u=(now*q.s+q.o)%1;
      q.c.setAttribute("cx",(300+q.x+Math.sin(now/800*q.w+q.o*9)*16*u).toFixed(1));
      q.c.setAttribute("cy",(385-u*205).toFixed(1));
      q.c.setAttribute("opacity",(po*Math.sin(Math.PI*u)*.9).toFixed(2));
    }
    
    
  }

  function label(){btn.textContent=target>=.5?"Fechar a flor":"Abrir a flor"}
  function frame(now){
    var dt=Math.min(Math.max(now-last,0),64); last=now;
    if(t!==target){
      var dir=target>t?1:-1; t+=dir*dt/DUR;
      if(dir>0?t>=target:t<=target)t=target;
    }
    update(now); slider.value=Math.round(t*1000);
    if(t===target&&(calm||t===0)){running=false;return}
    requestAnimationFrame(frame);
  }
  function kick(){if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}}
  function go(v){target=v;label();kick()}
  function toggle(){go(target>=.5?0:1)}

  btn.addEventListener("click",toggle);
  scene.addEventListener("click",toggle);
  scene.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
  slider.addEventListener("input",function(){t=target=slider.value/1000;label();kick()});

  if(calm){t=target=1}
  update(performance.now()); slider.value=Math.round(t*1000); label();
  if(!calm)setTimeout(function(){go(1)},900);
})();
</script>
</body>
</html>
