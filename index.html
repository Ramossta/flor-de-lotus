<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Aniversário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap">
<style>
:root{
  --sky-top:#fde7ea; --sky-bot:#f7efe6; --water:#a9cfcf; --pad:#5a9470;
  --ink:#43243a; --glow:#ffc4da; --ring:#2d6a6a; --btn-bg:rgba(255,255,255,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky-top:#0a1024; --sky-bot:#1d2c52; --water:#0c2236; --pad:#1f5a45;
    --ink:#f6e6ee; --glow:#ff9cc4; --ring:#7fc4d6; --btn-bg:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  --sky-top:#0a1024; --sky-bot:#1d2c52; --water:#0c2236; --pad:#1f5a45;
  --ink:#f6e6ee; --glow:#ff9cc4; --ring:#7fc4d6; --btn-bg:rgba(255,255,255,.08);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; overflow-x:hidden; display:flex; flex-direction:column; align-items:center;
  background:linear-gradient(var(--sky-top),var(--sky-bot)); color:var(--ink);
  font-family:"Fraunces",Georgia,serif;
} 
header{padding:28px 20px 0; text-align:center}
h1{margin:0; font-style:italic; font-weight:300; font-size:clamp(2rem,6vw,3rem); letter-spacing:.01em}
header p{margin:6px 0 0; font-size:1rem; opacity:.75}
.stage{width:min(100%,600px); flex:none; margin-top:auto}
svg{display:block; width:100%; height:auto; overflow:visible; cursor:pointer}
footer{flex:1; width:100%; background:var(--water); display:flex; justify-content:center; padding:8px 20px 28px}
.controls{display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center; height:max-content}
button{
  font:inherit; color:var(--ink); background:var(--btn-bg); border:1px solid currentColor;
  border-radius:999px; padding:9px 22px; cursor:pointer; min-width:9.5rem;
}
button:hover{background:var(--glow); color:#43243a}
input[type=range]{width:min(52vw,220px); accent-color:#d6336c}
button:focus-visible,input:focus-visible,svg:focus-visible{outline:3px solid var(--ring); outline-offset:3px}
.ripple{fill:none; stroke:var(--ring); stroke-width:1.4; vector-effect:non-scaling-stroke; opacity:0;
  transform-box:fill-box; transform-origin:center; animation:ripple 6s ease-out infinite}
.ripple:nth-child(2){animation-delay:2s} .ripple:nth-child(3){animation-delay:4s}
@keyframes ripple{0%{transform:scale(.25); opacity:.55} 100%{transform:scale(1.7); opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Feliz Aniversário</h1>
  <p>Que seu amor floreça como esta flor</p>
</header>

<div class="stage">
<svg id="scene" viewBox="0 0 600 520" role="img" tabindex="0" aria-label="Uma flor-de-lótus rosa abrindo sobre a água">
  <defs>
    <radialGradient id="halo"><stop offset="0" style="stop-color:var(--glow)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--glow)" stop-opacity="0"/></radialGradient>
    <linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9e8"/><stop offset=".55" stop-color="#f06aa0"/><stop offset="1" stop-color="#a3124f"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ef"/><stop offset=".55" stop-color="#f27aae"/><stop offset="1" stop-color="#b8185a"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0f6"/><stop offset=".5" stop-color="#f78fbb"/><stop offset="1" stop-color="#d02a73"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7f0"/><stop offset=".45" stop-color="#ffb3cf"/><stop offset="1" stop-color="#e8528f"/></linearGradient>
  </defs>

  <rect x="-3000" y="432" width="6600" height="90" style="fill:var(--water)"/>
  <g>
    <ellipse class="ripple" cx="300" cy="446" rx="170" ry="16"/>
    <ellipse class="ripple" cx="300" cy="446" rx="170" ry="16"/>
    <ellipse class="ripple" cx="300" cy="446" rx="170" ry="16"/>
  </g>
  <ellipse cx="110" cy="468" rx="78" ry="13" style="fill:var(--pad)"/>
  <ellipse cx="505" cy="462" rx="62" ry="10" style="fill:var(--pad)"/>
  <ellipse cx="300" cy="438" rx="120" ry="12" style="fill:var(--pad)"/>

  <circle id="glow" cx="300" cy="350" r="120" fill="url(#halo)" opacity="0"/>
  <g id="flower" transform="translate(300 436)"></g>
</svg>
</div>

<footer>
  <div class="controls">
    <button id="toggle" type="button">Abrir a flor</button>
    <input id="slider" type="range" min="0" max="1000" value="0" aria-label="Quanto a flor está aberta">
  </div>
</footer>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg", PATH="M0 0C-34 -30 -46 -105 0 -175C46 -105 34 -30 0 0Z";
  var layers=[
    {n:9,max:88,len:1.00,w:1.00,delay:0.00,g:"g0"},
    {n:8,max:66,len:0.92,w:0.95,delay:0.12,g:"g1"},
    {n:7,max:44,len:0.82,w:0.92,delay:0.24,g:"g2"},
    {n:5,max:22,len:0.68,w:0.90,delay:0.36,g:"g3"}
  ];
  var flower=document.getElementById("flower"), glow=document.getElementById("glow");
  var btn=document.getElementById("toggle"), slider=document.getElementById("slider");
  var petals=[], stamens=[];
  function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
  function clamp(x){return x<0?0:x>1?1:x}
  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}

  function buildLayer(L,idx){
    var g=el("g",{},flower);
    for(var i=0;i<L.n;i++){
      var p=el("g",{},g);
      el("path",{d:PATH,fill:"url(#"+L.g+")",stroke:"rgba(255,255,255,.4)","stroke-width":".8"},p);
      var base=-L.max+2*L.max*(i/(L.n-1));
      var jitter=((i*37+idx*11)%7-3)*0.9;
      petals.push({el:p,L:L,base:base,jit:jitter,extra:Math.abs(i-(L.n-1)/2)*0.008});
    }
  }
  buildLayer(layers[0],0); buildLayer(layers[1],1);

  var sg=el("g",{},flower);
  for(var s=0;s<15;s++){
    var a=(-42+84*s/14)*Math.PI/180, len=44+(s%3)*9;
    var ln=el("line",{x1:0,y1:-14,x2:0,y2:-14,stroke:"#f4c542","stroke-width":2.2,"stroke-linecap":"round"},sg);
    var dot=el("circle",{r:3.4,fill:"#ffd966",cx:0,cy:-14},sg);
    stamens.push({ln:ln,dot:dot,a:a,len:len});
  }
  var pod=el("ellipse",{cx:0,cy:-20,rx:14,ry:9,fill:"#e8b730"},sg);
  buildLayer(layers[2],2); buildLayer(layers[3],3);

  function update(t){
    petals.forEach(function(p){
      var e=ease(clamp((t-p.L.delay-p.extra)/0.6));
      var ang=p.base*(0.1+0.9*e)+p.jit*e;
      var sx=p.L.w*(0.5+0.5*e), sy=p.L.len*(0.86+0.14*e);
      p.el.setAttribute("transform","rotate("+ang.toFixed(2)+") scale("+sx.toFixed(3)+" "+sy.toFixed(3)+")");
    });
    var se=ease(clamp((t-0.3)/0.6));
    stamens.forEach(function(s){
      var x=Math.sin(s.a)*s.len*se, y=-14-Math.cos(s.a)*s.len*se;
      s.ln.setAttribute("x2",x.toFixed(1)); s.ln.setAttribute("y2",y.toFixed(1));
      s.dot.setAttribute("cx",x.toFixed(1)); s.dot.setAttribute("cy",y.toFixed(1));
    });
    pod.setAttribute("opacity",se);
    var ge=ease(t);
    glow.setAttribute("r",(90+150*ge).toFixed(0));
    glow.setAttribute("opacity",(0.12+0.5*ge).toFixed(2));
  }

  var t=0, target=1, raf=0, last=0, DUR=4200;
  function label(){btn.textContent=target?"Fechar a flor":"Abrir a flor"}
  function step(now){
    var dt=now-last; last=now;
    t+=(target?1:-1)*dt/DUR; t=clamp(t);
    update(t); slider.value=Math.round(t*1000);
    if((target&&t<1)||(!target&&t>0)) raf=requestAnimationFrame(step); else raf=0;
  }
  function go(to){
    target=to; label(); cancelAnimationFrame(raf);
    last=performance.now(); raf=requestAnimationFrame(step);
  }
  function toggle(){go(target?0:1)}

  btn.addEventListener("click",toggle);
  document.getElementById("scene").addEventListener("click",toggle);
  document.getElementById("scene").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
  slider.addEventListener("input",function(){
    cancelAnimationFrame(raf); raf=0;
    t=slider.value/1000; target=t>0.5?1:0; label(); update(t);
  });

  update(0);
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){t=1;target=1;update(1);slider.value=1000;label()}
  else{target=0;label();setTimeout(function(){go(1)},700)}
})();
</script>
</body>
</html>
